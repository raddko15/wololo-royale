# Builds the web version and publishes it on GitHub Pages at
# https://<owner>.github.io/<repo>/ on every push to main.
name: Web build on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true
      - name: Export
        run: |
          mkdir -p build/web
          godot --headless --path . --import || true
          godot --headless --path . --export-release Web build/web/index.html
          test -f build/web/index.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
