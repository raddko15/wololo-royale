# Fly.io app for the multiplayer relay. Deploy from this folder:
#   fly launch --copy-config --no-deploy   (first time; pick a unique app name)
#   fly deploy
app = "wololo-royale-relay"
primary_region = "waw"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
